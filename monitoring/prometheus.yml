global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: 'production'
    project: 'invmis'

scrape_configs:
  # 🚀 Production API Monitoring
  - job_name: 'invmis-api-prod'
    static_configs:
      - targets: ['invmis-api:5000']
    metrics_path: '/api/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
    
  # 🌐 Nginx Production Monitoring
  - job_name: 'nginx-prod'
    static_configs:
      - targets: ['nginx:80']
    metrics_path: '/nginx_status'
    scrape_interval: 30s
    
  # 📊 Prometheus Self-Monitoring
  - job_name: 'prometheus-prod'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s


