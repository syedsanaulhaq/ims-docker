version: '3.8'

services:
  backend-test:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ims-backend-test
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=test
      - SQL_SERVER_HOST=host.docker.internal
      - SQL_SERVER_PORT=1433
      - SQL_SERVER_USER=inventorymanagementuser
      - SQL_SERVER_PASSWORD=2016Wfp61@
      - SQL_SERVER_DATABASE=InventoryManagementDB
      - SESSION_SECRET=test_session_secret_invmis
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend-test:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ims-frontend-test
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "4173:4173"
    depends_on:
      - backend-test
    environment:
      - VITE_API_URL=http://localhost:5001
      - PORT=4173
    command: ["npx", "vite", "--host", "0.0.0.0", "--port", "4173"]