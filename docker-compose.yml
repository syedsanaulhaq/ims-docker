version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ims-backend-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=development
      - SQL_SERVER_HOST=host.docker.internal
      - SQL_SERVER_PORT=1433
      - SQL_SERVER_USER=inventorymanagementuser
      - SQL_SERVER_PASSWORD=2016Wfp61@
      - SQL_SERVER_DATABASE=InventoryManagementDB
      - SESSION_SECRET=inventory-management-secret-key-2025
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ims-frontend-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "9080:9090"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:3001
      - PORT=9090
    restart: unless-stopped
