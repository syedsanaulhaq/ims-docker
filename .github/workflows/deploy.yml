name: IMS CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🔍 Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: 🏗️  Build Docker images
        run: |
          docker compose build --no-cache

      - name: ✅ Run tests
        run: |
          docker compose -f docker-compose.test.yml up -d
          sleep 10
          docker compose -f docker-compose.test.yml exec -T backend npm test || true
          docker compose -f docker-compose.test.yml down

      - name: 📊 Run security scan
        run: |
          docker scan ims-docker-v1-backend:latest || true
          docker scan ims-docker-v1-frontend:latest || true

      - name: 🔐 Login to Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Push images to registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ims-docker-v1-backend:latest ${{ env.REGISTRY }}/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')/backend:latest
          docker tag ims-docker-v1-frontend:latest ${{ env.REGISTRY }}/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')/frontend:latest
          docker push ${{ env.REGISTRY }}/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')/backend:latest
          docker push ${{ env.REGISTRY }}/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')/frontend:latest

      - name: 🚀 Deploy to production (if main branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "🚀 Deploying to production..."
          # Add your SSH deployment command here
          # ssh -i ${{ secrets.PROD_SSH_KEY }} ubuntu@172.20.150.127 'cd ~/ims-docker-v1 && docker compose pull && docker compose up -d'
