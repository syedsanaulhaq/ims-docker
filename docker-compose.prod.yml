# 🌐 InvMIS Production Docker Compose
# Production-ready deployment
version: '3.8'

services:
  # 🚀 InvMIS API Backend
  invmis-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invmis-api-prod
    restart: unless-stopped
    ports:
      - "5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    env_file:
      - .env.production
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/var/log/invmis
      - frontend-dist:/app/public
    networks:
      - invmis-network
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # 🌐 Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: invmis-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./logs/nginx:/var/log/nginx
      - frontend-dist:/usr/share/nginx/html
    depends_on:
      - invmis-api
    networks:
      - invmis-network

networks:
  invmis-network:
    driver: bridge

volumes:
  frontend-dist: